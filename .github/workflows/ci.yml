name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]

concurrency:
  # Cancel in-progress runs when a PR branch is updated.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  # for actions/checkout
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Identify Dependency Derivation
        id: deps
        run: |
          drv=$(nix eval --raw .#deps.drvPath)
          out=$(nix eval --raw .#deps.outPath)
          printf 'key=praddle-deps-v1-%s\nout=%s\n' "${drv##*/}" "$out" >> "$GITHUB_OUTPUT"
      - name: Restore Dependency Cache
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/praddle-deps-cache
          key: ${{ steps.deps.outputs.key }}
      - name: Import Dependency Output
        if: steps.deps-cache.outputs.cache-hit == 'true'
        env:
          DEPS_OUTPUT: ${{ steps.deps.outputs.out }}
        # GitHub's cache scope determines which producers are trusted here.
        run: nix copy --no-check-sigs --from "file://$RUNNER_TEMP/praddle-deps-cache" "$DEPS_OUTPUT"
      - name: Build and Export Dependency Output
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          DEPS_OUTPUT: ${{ steps.deps.outputs.out }}
        run: |
          nix build --no-link --print-build-logs .#deps
          nix copy --to "file://$RUNNER_TEMP/praddle-deps-cache" "$DEPS_OUTPUT"
      - name: Save Dependency Cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/praddle-deps-cache
          key: ${{ steps.deps.outputs.key }}
      - name: Check Nix Flake
        run: nix flake check --verbose --print-build-logs --fallback --keep-going
